<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pong Game</h1>
        <div class="scoreboard">
            <div class="score">
                <span class="label">Player</span>
                <span class="value" id="playerScore">0</span>
            </div>
            <div class="divider">|</div>
            <div class="score">
                <span class="label">Computer</span>
                <span class="value" id="computerScore">0</span>
            </div>
        </div>
        
        <div class="game-info">
            <p><strong>Controls:</strong></p>
            <p>Mouse Y-position or Arrow Keys (↑/↓) to move left paddle</p>
            <p>First to 11 points wins!</p>
        </div>
        
        <canvas id="pongCanvas" width="800" height="400"></canvas>
        
        <div id="gameOverScreen" class="game-over-hidden">
            <div class="game-over-content">
                <h2 id="gameOverText">Game Over!</h2>
                <p id="winnerText"></p>
                <button onclick="location.reload()">Play Again</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
